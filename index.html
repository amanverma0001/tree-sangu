<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Always Stay Happy with me.. dear Sangu 💖✨ | Tree of Love</title>
  
  <!-- SEO & Social Sharing Preview -->
  <meta name="description" content="A magical glowing fractal tree animation made with love for Sangu.">
  <meta property="og:title" content="Always Stay Happy with me.. dear Sangu 💖✨">
  <meta property="og:description" content="Click to watch the tree of love bloom gently just for you.">
  <meta property="og:type" content="website">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Romantic Ambient Aurora Glow Orbs (Dynamic Background) -->
  <div class="ambient-aurora" aria-hidden="true">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
  </div>

  <!-- Ambient Background Canvas (Stars, Nebula, Fireflies, Meteors) -->
  <canvas id="bg-canvas"></canvas>

  <!-- Main Fractal Tree Canvas -->
  <canvas id="tree-canvas"></canvas>

  <!-- Continuous Romantic Floating Hearts & Petals (Behind & around tree) -->
  <div id="ambient-floating-hearts" class="ambient-floating-hearts" aria-hidden="true"></div>

  <!-- Interactive Click/Tap Floating Hearts Container -->
  <div id="heart-particles" aria-hidden="true"></div>

  <!-- Romantic Gift Envelope / Home Page Card (Appears on first load) -->
  <div id="intro-overlay" class="intro-overlay">
    <div class="intro-backdrop"></div>

    <!-- Moving Romantic Home Background Animations -->
    <div class="intro-bg-animations" aria-hidden="true">
      <div class="home-aurora-glow"></div>
      <div class="shooting-star s-star-1"></div>
      <div class="shooting-star s-star-2"></div>
      <div class="shooting-star s-star-3"></div>
      <div id="home-floating-hearts" class="home-floating-hearts"></div>
    </div>

    <div class="envelope-card" id="envelope-card">
      <div class="envelope-top-flare"></div>

      <div class="envelope-content">
        <p class="greeting-pre">Ek pyara sa tohfa...</p>
        <h1 class="greeting-title" id="intro-name">For Sangu 💖</h1>

        <!-- Hero Photo Frame with Slideshow, Glow & Shimmer -->
        <div class="hero-photo-wrapper">
          <div class="photo-glow-ring"></div>
          <div class="photo-frame">
            <div class="slideshow-container" id="intro-slideshow">
              <img src="sangu_1.jpg" alt="Sangu 1" class="hero-photo slide active">
              <img src="sangu_2.jpg" alt="Sangu 2" class="hero-photo slide">
              <img src="sangu_3.jpg" alt="Sangu 3" class="hero-photo slide">
              <img src="sangu_4.jpg" alt="Sangu 4" class="hero-photo slide">
            </div>
            <div class="photo-shimmer"></div>
            <div class="slide-dots" id="slide-dots">
              <span class="slide-dot active" data-index="0"></span>
              <span class="slide-dot" data-index="1"></span>
              <span class="slide-dot" data-index="2"></span>
              <span class="slide-dot" data-index="3"></span>
            </div>
            <div class="photo-badge" title="My Love">
              <span>💖</span>
            </div>
          </div>
          <span class="photo-sparkle s1" aria-hidden="true">✨</span>
          <span class="photo-sparkle s2" aria-hidden="true">🌸</span>
          <span class="photo-sparkle s3" aria-hidden="true">✨</span>
        </div>

        <p class="greeting-subtitle">Tap below to watch your tree bloom ✨</p>
        
        <button class="open-action-btn" id="open-btn-text">
          <span class="btn-heart-pulse">💖</span>
          <span>Khuliye Pyaar Se 💌</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Top Controls (Photo Gallery & Music Toggle) -->
  <div class="top-controls">
    <button id="photo-modal-open-btn" class="glass-pill-btn photo-pill" aria-label="View Sangu Photos" title="View Sangu's Photos">
      <span class="photo-btn-thumb"><img src="sangu_1.jpg" alt="Sangu Thumbnail" id="header-thumb"></span>
      <span class="photo-btn-text">Memories (4) 💖</span>
    </button>

    <button id="music-toggle" class="glass-pill-btn" aria-label="Toggle Romantic Music" title="Romantic Music">
      <span class="music-icon" id="music-icon">🎵</span>
      <span class="music-label" id="music-label">Music</span>
      <div class="sound-wave" id="sound-wave">
        <span></span><span></span><span></span>
      </div>
    </button>
  </div>

  <!-- Tree Bottom Love Message Container -->
  <div class="message-container" id="message-container">
    <div class="message-glow-wrapper">
      <h2 class="love-text" id="love-text">
        <span class="sub-lead">Always Stay Happy with me..</span>
        <span class="main-name">dear Sangu <span class="heart-emoji">💖✨</span></span>
      </h2>
      <p class="personalized-note" id="personalized-note"></p>
    </div>
  </div>

  <!-- Bottom Floating Control Dock -->
  <nav class="bottom-dock" id="bottom-dock" aria-label="Animation Controls">
    <button id="replay-btn" class="dock-btn" title="Watch Tree Grow Again">
      <span class="btn-icon">↺</span>
      <span class="btn-label">Replay</span>
    </button>

    <button id="gallery-dock-btn" class="dock-btn" title="View Sangu's Photos">
      <span class="btn-icon">📸</span>
      <span class="btn-label">Memories</span>
    </button>
    
    <div class="speed-selector" title="Animation Speed">
      <button class="speed-btn active" data-speed="1" title="Aaram se (Romantic & Slow)">🐢 Aaram Se</button>
      <button class="speed-btn" data-speed="1.75" title="Thoda Fast">⚡ Fast</button>
    </div>

    <button id="screenshot-btn" class="dock-btn" title="Save as Wallpaper">
      <span class="btn-icon">🖼️</span>
      <span class="btn-label">Wallpaper</span>
    </button>
    
    <button id="share-btn" class="dock-btn" title="Copy Link to Share">
      <span class="btn-icon">🔗</span>
      <span class="btn-label">Share Link</span>
    </button>
  </nav>

  <!-- Finished Tree Celebration Banner -->
  <div id="celebration-toast" class="celebration-toast" role="status" aria-live="polite">
    <span class="toast-heart">💖</span>
    <div class="toast-text" id="toast-text">
      <div class="toast-lines">
        <span class="toast-line">i like you a lot dear...</span>
        <span class="toast-line">love your voice and the way you look..</span>
        <span class="toast-line highlight">want to know you more bbu. 💖✨</span>
      </div>
    </div>
  </div>

  <!-- Romantic Photo Gallery Lightbox Modal -->
  <div id="photo-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="photo-modal-backdrop" id="photo-modal-backdrop"></div>
    <div class="photo-modal-card">
      <button id="photo-modal-close" class="modal-close-icon" aria-label="Close Photo Gallery">&times;</button>
      
      <div class="gallery-counter" id="gallery-counter">1 / 4</div>

      <div class="photo-modal-frame-wrapper">
        <button class="gallery-nav-btn prev" id="gallery-prev" aria-label="Previous Photo">&#10094;</button>

        <div class="photo-modal-frame">
          <img src="sangu_1.jpg" alt="Sangu" class="modal-photo" id="gallery-img">
        </div>

        <button class="gallery-nav-btn next" id="gallery-next" aria-label="Next Photo">&#10095;</button>
      </div>

      <div class="photo-modal-caption">
        <p class="caption-title" id="gallery-title">Ho, aate-jaate dekhoon tujh ko 🌹</p>
        <p class="caption-sub" id="gallery-sub">Jaane hua hai ye kya mujh ko... ✨</p>
      </div>

      <!-- Thumbnail Strip -->
      <div class="gallery-thumbs" id="gallery-thumbs">
        <button class="thumb-btn active" data-index="0"><img src="sangu_1.jpg" alt="Thumb 1"></button>
        <button class="thumb-btn" data-index="1"><img src="sangu_2.jpg" alt="Thumb 2"></button>
        <button class="thumb-btn" data-index="2"><img src="sangu_3.jpg" alt="Thumb 3"></button>
        <button class="thumb-btn" data-index="3"><img src="sangu_4.jpg" alt="Thumb 4"></button>
      </div>
    </div>
  </div>

  <!-- Core Javascript -->
  <script src="script.js"></script>
</body>
</html>
